<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F4F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#11151B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nà Ná Na">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Máy tính tiền Nà Ná Na</title>
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: thanh thương hiệu cam ở trên, lưới ảnh món (kiểu PosApp), trang Tổng quan có biểu đồ (kiểu Sapo), thanh 5 tab cố định ở đáy. Máy tính để bàn chia 2 cột: món bên trái, đơn bên phải. */
:root {
  --bg: #F3F4F7;
  --surface: #FFFFFF;
  --ink: #1E2430;
  --muted: #5E6878;
  --line: #DDE1E8;
  --accent: #BF5700;
  --accent-ink: #FFFFFF;
  --hi: #F28C1B;
  --tint: #FFF0DD;
  --good: #1D7A4D;
  --bad: #B3321F;
  --photo: #FFFFFF;
  --display: "Baloo 2", "Be Vietnam Pro", system-ui, sans-serif;
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151B; --surface: #1B212A; --ink: #EEF1F5; --muted: #9AA6B5; --line: #2C3541;
    --accent: #FF9B3F; --accent-ink: #1B0F00; --hi: #FF9B3F; --tint: #2B2218; --good: #58C48B; --bad: #FF8B77;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151B; --surface: #1B212A; --ink: #EEF1F5; --muted: #9AA6B5; --line: #2C3541;
  --accent: #FF9B3F; --accent-ink: #1B0F00; --hi: #FF9B3F; --tint: #2B2218; --good: #58C48B; --bad: #FF8B77;
  color-scheme: dark;
}
* { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 210px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--hi); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* thanh thương hiệu */
.top { display: flex; align-items: center; gap: 12px; background: var(--accent); color: var(--accent-ink); border-radius: 16px; padding: 10px 14px; }
.top .logo { width: 52px; height: 42px; object-fit: contain; background: #fff; border-radius: 10px; padding: 2px; flex: none; }
.top .tt { min-width: 0; flex: 1; }
.top h1 { margin: 0; font-family: var(--display); font-size: 22px; font-weight: 800; line-height: 1.1; }
.top p { margin: 0; font-size: 12px; opacity: .85; }
.top .today { text-align: right; flex: none; }
.top .today small { display: block; font-size: 11px; opacity: .85; }
.top .today strong { font-family: var(--display); font-size: 22px; font-weight: 800; line-height: 1.1; }

h2 { margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
h3 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 700; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.empty { color: var(--muted); padding: 4px 0; }
.muted { color: var(--muted); }
.sm { font-size: 13px; }

/* nút */
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: 15px; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 600; }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); font-weight: 600; }
.btn.small { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* chip nhóm + thanh chọn khoảng thời gian */
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; min-width: 0; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 13px; font-weight: 600; font-size: 13.5px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.seg.two { grid-template-columns: 1fr 1fr; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 9px 4px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* bán hàng */
.sale { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
@media (min-width: 900px) { .sale { grid-template-columns: minmax(0, 1fr) 360px; } .cartcol { position: sticky; top: 12px; } }
.menucol { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tile { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; text-align: left; padding: 0; }
button.tile:active { transform: scale(.98); }
.tile .ph { position: relative; background: var(--photo); aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; }
.tile .ph img { width: 100%; height: 100%; object-fit: contain; }
.tile .ph.drink img { padding: 8px 0; }
.tile .ph .ini { font-family: var(--display); font-size: 48px; font-weight: 800; color: var(--accent); }
.tile .ph.noimg { background: var(--tint); }
.tile .badge { position: absolute; top: 8px; right: 8px; min-width: 28px; height: 28px; padding: 0 8px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.tile .tb { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.tile .nm { font-weight: 600; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; }
.tile .ds { color: var(--muted); font-size: 11.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .pr { font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 18px; line-height: 1.2; }
.tile .pr small { font-family: var(--font); font-weight: 500; font-size: 12px; color: var(--muted); }
.tile .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 2px; }
.tile .two button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 4px; font-weight: 700; font-size: 13px; line-height: 1.2; }
.tile .two button b { display: block; font-family: var(--display); font-size: 16px; color: var(--accent); }
.tile .two button:active { background: var(--tint); }

/* đơn hiện tại */
.cartcol { min-width: 0; }
.cart-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.line .l-name { font-weight: 600; overflow-wrap: anywhere; }
.line .l-sub { color: var(--muted); font-size: 12px; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; font-weight: 600; line-height: 1; }
.stepper span { min-width: 26px; text-align: center; font-weight: 800; }
.line .l-total { font-weight: 700; min-width: 72px; text-align: right; }
select, input[type="text"], input[type="number"], input[type="date"], textarea {
  font-family: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; min-width: 0; width: 100%;
}
textarea { resize: vertical; min-height: 84px; }
label.lb { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
.tot { display: flex; justify-content: space-between; align-items: baseline; }
.tot.big strong { font-family: var(--display); font-size: 28px; font-weight: 800; }
.disc { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; }

/* thanh đáy */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock-in { max-width: 1080px; margin: 0 auto; }
.cartbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cartbar .sum { background: none; border: 0; text-align: left; padding: 0; }
.cartbar .sum small { display: block; color: var(--muted); font-size: 12px; }
.cartbar .sum strong { font-family: var(--display); font-size: 26px; font-weight: 800; line-height: 1.1; }
.cartbar .btn { padding: 14px 24px; font-size: 16px; }
nav { display: grid; grid-template-columns: repeat(5, 1fr); }
nav button { background: transparent; border: 0; padding: 8px 2px 9px; font-weight: 600; font-size: 11.5px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; border-top: 3px solid transparent; }
nav button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav button[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }

/* tổng quan */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; }
.stat small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.stat strong { font-family: var(--display); font-size: clamp(15px, 4.4vw, 20px); font-weight: 800; white-space: nowrap; line-height: 1.25; }
.stat.main { grid-column: 1 / -1; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.stat.main small { color: inherit; opacity: .85; }
.stat.main strong { font-size: 34px; }
.delta { font-size: 12.5px; font-weight: 600; }
.stat.main .delta { opacity: .95; }
.up { color: var(--good); } .down { color: var(--bad); }
.stat.main .up, .stat.main .down { color: inherit; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 9.5px; font-family: var(--font); }
.chart .pk { fill: var(--ink); font-weight: 700; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
.bar .bn { overflow-wrap: anywhere; font-size: 14px; }
.bar .bv { font-weight: 700; font-size: 14px; }
.bar .track { grid-column: 1 / -1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--hi); border-radius: 4px; }
.use { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); }
.use:first-of-type { border-top: 0; }
.use .un { font-weight: 600; }
.use .uv { font-family: var(--display); font-size: 22px; font-weight: 800; text-align: right; }
.use .us { color: var(--muted); font-size: 12.5px; }
.use .up2 { text-align: right; color: var(--accent); font-weight: 700; font-size: 14px; }

/* đơn hàng + sổ ngày + thực đơn */
.ord { padding: 12px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.ord:first-of-type { border-top: 0; }
.oh { display: flex; align-items: baseline; gap: 10px; }
.oh .seq { font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--accent); }
.oh .meta { color: var(--muted); font-size: 12.5px; flex: 1; }
.oh strong { font-family: var(--display); font-size: 20px; }
.oi { overflow-wrap: anywhere; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 700; background: var(--tint); color: var(--accent); }
.kv { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); }
.kv:first-of-type { border-top: 0; }
.kv input { width: 150px; text-align: right; }
.mrowi { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.mrowi:first-of-type { border-top: 0; }
.mrowi img { width: 44px; height: 44px; object-fit: contain; background: var(--photo); border-radius: 8px; }
.mrowi .ini { width: 44px; height: 44px; border-radius: 8px; background: var(--tint); color: var(--accent); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 800; font-size: 20px; }
.mrowi .mn { font-weight: 600; overflow-wrap: anywhere; }
.mrowi .mp { font-weight: 700; color: var(--accent); white-space: nowrap; }
.grp { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding-top: 6px; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.g3 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; }
.rrow { display: grid; grid-template-columns: minmax(0, 1fr) 90px 40px; gap: 8px; align-items: center; }
.rrow .x { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--bad); font-size: 18px; }

/* hộp thoại dưới */
.sheet { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 700px) { .sheet { align-items: center; } .sheet-in { border-radius: 18px !important; } }
.sheet-in { width: 100%; max-width: 560px; background: var(--surface); border-radius: 18px 18px 0 0; padding: 16px; display: flex; flex-direction: column; gap: 12px; max-height: 94%; overflow-y: auto;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.sh-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sh-head .x { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-size: 20px; }
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.quick button { padding: 12px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-weight: 700; font-size: 14px; }
.quick button.full { grid-column: 1 / -1; background: var(--hi); color: #1B1000; border-color: var(--hi); font-size: 15px; }
.change { padding: 12px 14px; border-radius: 12px; background: var(--bg); display: flex; justify-content: space-between; align-items: baseline; }
.change strong { font-family: var(--display); font-size: 28px; font-weight: 800; }
.change.short strong { color: var(--bad); }
.qrbox { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.qrbox .qrw { background: #fff; border-radius: 14px; padding: 10px; border: 1px solid var(--line); }
.qrbox canvas, .qrbox img { width: 240px; height: 240px; display: block; image-rendering: pixelated; }
.rcpt { background: var(--bg); border: 1px dashed var(--muted); border-radius: 12px; padding: 14px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(110px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; max-width: 90%; text-align: center; }
@media (prefers-reduced-motion: no-preference) { .tile { transition: transform .08s; } }
</style>

<div class="wrap">
  <header class="top">
    <img class="logo" id="logo" alt="Nà Ná Na">
    <div class="tt"><h1>Nà Ná Na</h1><p id="dateLabel"></p></div>
    <div class="today"><small>Doanh thu hôm nay</small><strong class="num" id="todayRev">0đ</strong></div>
  </header>

  <section id="v-sale" class="sale">
    <div class="menucol">
      <div class="chips" id="catChips" role="group" aria-label="Nhóm món"></div>
      <div class="grid" id="grid"></div>
    </div>
    <aside class="cartcol" id="cartPanel"><div class="panel" id="cart"></div></aside>
  </section>

  <section id="v-orders" hidden>
    <div class="wrap" style="gap:14px">
      <div class="seg" id="odSeg"></div>
      <div class="panel" id="odList"></div>
    </div>
  </section>

  <section id="v-over" hidden>
    <div class="wrap" style="gap:14px">
      <div class="seg" id="ovSeg"></div>
      <div id="ovBody" class="wrap" style="gap:14px"></div>
    </div>
  </section>

  <section id="v-ledger" hidden>
    <div class="wrap" style="gap:14px" id="ldBody"></div>
  </section>

  <section id="v-menu" hidden>
    <div class="wrap" style="gap:14px" id="mnBody"></div>
  </section>
</div>

<div class="dock">
  <div class="dock-in">
    <div class="cartbar" id="cartbar" hidden>
      <button class="sum" id="goCart" type="button"><small id="cartCount">0 món</small><strong class="num" id="cartTotal">0đ</strong></button>
      <button class="btn" id="payBtn" type="button">Thanh toán</button>
    </div>
    <nav aria-label="Chuyển tab" id="nav"></nav>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in" id="sheetBody" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>

function vqrCrc(s){var c=0xFFFF;for(var i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(var k=0;k<8;k++){c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF;}}return ('0000'+c.toString(16).toUpperCase()).slice(-4);}

    var o = ed.o;
    var recRows = o.rec.map(function (r, i) {
      return '<div class="rrow"><select data-rec="i" data-idx="' + i + '" aria-label="Nguyên liệu">' + state.ings.map(function (g) { return '<option value="' + g.id + '"' + (g.id === r.i ? ' selected' : '') + '>' + esc(g.name) + '</option>'; }).join('') + '</select>' +
        '<input type="number" data-rec="q" data-idx="' + i + '" value="' + r.q + '" step="0.5" min="0" inputmode="decimal" aria-label="Số lượng"><button type="button" class="x" data-rmrec="' + i + '" aria-label="Bỏ dòng">×</button></div>';
    }).join('');
    var incRows = o.inc.map(function (r, i) {
      return '<div class="rrow"><select data-inc="m" data-idx="' + i + '" aria-label="Món bên trong">' + state.menu.filter(function (m) { return m.id !== o.id; }).map(function (m) { return '<option value="' + m.id + '"' + (m.id === r.m ? ' selected' : '') + '>' + esc(m.name) + '</option>'; }).join('') + '</select>' +
        '<input type="number" data-inc="q" data-idx="' + i + '" value="' + r.q + '" step="1" min="0" inputmode="numeric" aria-label="Số lượng"><button type="button" class="x" data-rminc="' + i + '" aria-label="Bỏ dòng">×</button></div>';
    }).join('');
    openSheet('<div class="sh-head"><h3>' + (ed.isNew ? 'Thêm món' : 'Sửa món') + '</h3><button type="button" class="x" data-close aria-label="Đóng">×</button></div>' +
      '<div><label class="lb" for="edName">Tên món</label><input type="text" id="edName" data-f="name" value="' + esc(o.name) + '"></div>' +
      '<div class="g2"><div><label class="lb" for="edCat">Nhóm</label><select id="edCat" data-f="cat">' + CATS.map(function (c) { return '<option value="' + c[0] + '"' + (o.cat === c[0] ? ' selected' : '') + '>' + c[1] + '</option>'; }).join('') + '</select></div>' +
      '<div><label class="lb" for="edUnit">Đơn vị bán</label><input type="text" id="edUnit" data-f="unit" value="' + esc(o.unit) + '" placeholder="viên, cây, phần..."></div></div>' +
      '<div class="g2"><div><label class="lb" for="edPrice">' + (o.raw != null ? 'Giá chín (đ)' : 'Giá (đ)') + '</label><input type="number" id="edPrice" data-f="price" inputmode="numeric" min="0" value="' + o.price + '"></div>' +
      '<div><label class="lb" for="edRaw">Giá sống (đ)</label><input type="number" id="edRaw" data-f="raw" inputmode="numeric" min="0" value="' + (o.raw == null ? '' : o.raw) + '" placeholder="Để trống nếu không bán sống"></div></div>' +
      '<div><label class="lb" for="edDesc">Mô tả ngắn</label><input type="text" id="edDesc" data-f="desc" value="' + esc(o.desc) + '"></div>' +
      '<h2>Nguyên liệu dùng cho 1 phần</h2>' + (recRows || '<div class="muted sm">Chưa có dòng nào.</div>') + '<button type="button" class="btn ghost small" data-addrec style="align-self:flex-start">Thêm nguyên liệu</button>' +
      '<h2>Gồm các món (dùng cho combo)</h2>' + (incRows || '<div class="muted sm">Chưa có dòng nào.</div>') + '<button type="button" class="btn ghost small" data-addinc style="align-self:flex-start">Thêm món vào combo</button>' +
      '<div class="row" style="justify-content:space-between"><button type="button" class="btn" data-edsave>Lưu</button>' + (ed.isNew ? '' : '<button type="button" class="btn danger" data-eddel>Xóa món</button>') + '</div>');
  }
  function openIngEditor(g, isNew) { ed = { kind: 'ing', isNew: isNew, o: JSON.parse(JSON.stringify(g)) }; renderIngEditor(); }
  function renderIngEditor() {
    var o = ed.o;
    openSheet('<div class="sh-head"><h3>' + (ed.isNew ? 'Thêm nguyên liệu' : 'Sửa nguyên liệu') + '</h3><button type="button" class="x" data-close aria-label="Đóng">×</button></div>' +
      '<div><label class="lb" for="egName">Tên</label><input type="text" id="egName" data-g="name" value="' + esc(o.name) + '"></div>' +
      '<div><label class="lb" for="egUnit">Đơn vị đếm</label><input type="text" id="egUnit" data-g="unit" value="' + esc(o.unit) + '" placeholder="chiếc, gói, chai..."></div>' +
      '<div class="g2"><div><label class="lb" for="egPack">Tên bao lớn (nếu có)</label><input type="text" id="egPack" data-g="pack" value="' + esc(o.pack || '') + '" placeholder="túi, gói, thùng"></div>' +
      '<div><label class="lb" for="egSize">Số lượng mỗi bao</label><input type="number" id="egSize" data-g="size" inputmode="numeric" min="0" value="' + (o.size || '') + '" placeholder="50"></div></div>' +
      '<div class="row" style="justify-content:space-between"><button type="button" class="btn" data-egsave>Lưu</button>' + (ed.isNew ? '' : '<button type="button" class="btn danger" data-egdel>Xóa</button>') + '</div>');
  }

  /* ---------- điều hướng ---------- */
  function setTab(t) {
    tab = t;
    ['sale', 'orders', 'over', 'ledger', 'menu'].forEach(function (k) { $('v-' + k).hidden = k !== t; });
    renderNav();
    if (t === 'sale') renderSale(); else if (t === 'orders') renderOrders(); else if (t === 'over') renderOver(); else if (t === 'ledger') renderLedger(); else renderMenu();
    updateDock(); window.scrollTo(0, 0);
  }
  function armDelete(el, fn) {
    if (el.dataset.armed) return fn();
    el.dataset.armed = '1'; var old = el.textContent; el.textContent = 'Bấm lại để xóa';
    setTimeout(function () { if (el.isConnected) { delete el.dataset.armed; el.textContent = old; } }, 3000);
  }

  document.addEventListener('click', function (e) {
    if (e.target.id === 'sheet') return closeSheet();
    var el = e.target.closest('button'); if (!el) return; var d = el.dataset;
    if (d.tab) return setTab(d.tab);
    if (d.cat) { cat = d.cat; return renderSale(); }
    if (d.add != null) { cart[d.add] = (cart[d.add] || 0) + 1; return renderSale(); }
    if (d.inc != null && !el.closest('.rrow')) { cart[d.inc] = (cart[d.inc] || 0) + 1; return renderSale(); }
    if (d.dec != null) { cart[d.dec] = Math.max(0, (cart[d.dec] || 0) - 1); return renderSale(); }
    if (el.hasAttribute('data-clearcart')) { cart = {}; cartNote = ''; disc = { t: 'amt', v: 0 }; return renderSale(); }
    if (el.id === 'goCart') { var cp = $('cartPanel'); if (cp.scrollIntoView) cp.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (el.id === 'payBtn') return openPay();
    if (el.hasAttribute('data-close')) return closeSheet();
    if (d.pm) { payM = d.pm; return renderPay(); }
    if (d.quick) { paid = Number(d.quick); var pi = $('paidIn'); if (pi) pi.value = paid; return updateChange(); }
    if (el.hasAttribute('data-confirm')) return confirmPay();
    if (d.od) { odR = d.od; return renderOrders(); }
    if (d.ov) { ovR = d.ov; return renderOver(); }
    if (d.best) { best = d.best; return renderOver(); }
    if (d.rcpt) {
      var o = state.orders.find(function (x) { return String(x.id) === d.rcpt; }); if (!o) return; rcptId = o.id;
      return openSheet('<div class="sh-head"><h3>Phiếu đơn #' + o.seq + '</h3><button type="button" class="x" data-close aria-label="Đóng">×</button></div><div class="rcpt">' + esc(receiptText(o)) + '</div><button type="button" class="btn" data-copyrcpt>Sao chép phiếu</button>');
    }
    if (el.hasAttribute('data-copyrcpt')) { var oo = state.orders.find(function (x) { return x.id === rcptId; }); if (oo) copyText(receiptText(oo), 'Đã sao chép phiếu'); return; }
    if (d.del) return armDelete(el, function () { state.orders = state.orders.filter(function (x) { return String(x.id) !== d.del; }); save(); renderOrders(); renderHeader(); toast('Đã xóa đơn'); });
    if (d.chip) { $('chLabel').value = d.chip; return; }
    if (el.hasAttribute('data-addchi')) {
      var lb = $('chLabel').value.trim(), am = Number($('chAmt').value) || 0;
      if (!lb || am <= 0) return toast('Nhập khoản chi và số tiền');
      state.chi.push({ id: Date.now(), day: viewDay, label: lb, amt: am, src: $('chSrc').value }); save(); return renderLedger();
    }
    if (d.delchi) return armDelete(el, function () { state.chi = state.chi.filter(function (x) { return String(x.id) !== d.delchi; }); save(); renderLedger(); });
    if (el.hasAttribute('data-addhao')) {
      var q = Number($('hwQty').value) || 0; if (q <= 0) return toast('Nhập số lượng hao hụt');
      state.hao.push({ id: Date.now(), day: viewDay, i: $('hwIng').value, q: q, why: $('hwWhy').value }); save(); return renderLedger();
    }
    if (d.delhao) return armDelete(el, function () { state.hao = state.hao.filter(function (x) { return String(x.id) !== d.delhao; }); save(); renderLedger(); });
    if (d.mi) { var it = itemById(d.mi); if (it) openItemEditor(it, false); return; }
    if (el.hasAttribute('data-newitem')) return openItemEditor({ id: 'm' + Date.now(), cat: cat, name: '', price: 0, raw: null, unit: '', img: '', desc: '', rec: [], inc: [] }, true);
    if (d.gi) { var g = ingById(d.gi); if (g) openIngEditor(g, false); return; }
    if (el.hasAttribute('data-newing')) return openIngEditor({ id: 'g' + Date.now(), name: '', unit: 'chiếc' }, true);
    if (el.hasAttribute('data-addrec') && ed) { ed.o.rec.push({ i: state.ings[0] ? state.ings[0].id : '', q: 1 }); return renderItemEditor(); }
    if (d.rmrec != null && ed) { ed.o.rec.splice(Number(d.rmrec), 1); return renderItemEditor(); }
    if (el.hasAttribute('data-addinc') && ed) { var first = state.menu.find(function (m) { return m.id !== ed.o.id; }); ed.o.inc.push({ m: first ? first.id : '', q: 1 }); return renderItemEditor(); }
    if (d.rminc != null && ed) { ed.o.inc.splice(Number(d.rminc), 1); return renderItemEditor(); }
    if (el.hasAttribute('data-edsave') && ed) {
      var x = ed.o; if (!x.name.trim()) return toast('Nhập tên món');
      x.name = x.name.trim(); x.price = Number(x.price) || 0; x.raw = (x.raw === '' || x.raw == null) ? null : (Number(x.raw) || 0);
      x.rec = x.rec.filter(function (r) { return r.i && r.q > 0; }); x.inc = x.inc.filter(function (r) { return r.m && r.q > 0; });
      var ix = state.menu.findIndex(function (m) { return m.id === x.id; });
      if (ix >= 0) state.menu[ix] = x; else state.menu.push(x);
      save(); closeSheet(); renderMenu(); return toast('Đã lưu món');
    }
    if (el.hasAttribute('data-eddel') && ed) return armDelete(el, function () {
      var id = ed.o.id; state.menu = state.menu.filter(function (m) { return m.id !== id; });
      state.menu.forEach(function (m) { m.inc = m.inc.filter(function (c) { return c.m !== id; }); });
      Object.keys(cart).forEach(function (k) { if (k.split('|')[0] === id) delete cart[k]; });
      save(); closeSheet(); renderMenu(); toast('Đã xóa món');
    });
    if (el.hasAttribute('data-egsave') && ed) {
      var y = ed.o; if (!y.name.trim()) return toast('Nhập tên nguyên liệu');
      y.name = y.name.trim(); y.size = Number(y.size) || 0; if (!y.pack || !y.size) { delete y.pack; delete y.size; }
      var iy = state.ings.findIndex(function (z) { return z.id === y.id; });
      if (iy >= 0) state.ings[iy] = y; else state.ings.push(y);
      save(); closeSheet(); renderMenu(); return toast('Đã lưu nguyên liệu');
    }
    if (el.hasAttribute('data-egdel') && ed) return armDelete(el, function () {
      var gid = ed.o.id; state.ings = state.ings.filter(function (z) { return z.id !== gid; });
      state.menu.forEach(function (m) { m.rec = m.rec.filter(function (r) { return r.i !== gid; }); });
      save(); closeSheet(); renderMenu(); toast('Đã xóa nguyên liệu');
    });
    if (el.hasAttribute('data-bk-copy')) return copyText(JSON.stringify(state), 'Đã sao chép bản sao lưu. Dán vào ghi chú hoặc Zalo để giữ.');
    if (el.hasAttribute('data-bk-dl')) { download('nana-pos-backup-' + dk(new Date()) + '.json', JSON.stringify(state), 'application/json'); return toast('Nếu không thấy file tải về, hãy dùng nút Sao chép'); }
    if (el.hasAttribute('data-csv')) {
      var rows = ['ngay,gio,so_don,mon,tong,hinh_thuc'];
      state.orders.forEach(function (o) { rows.push([o.day, o.time, o.seq, '"' + o.lines.map(function (l) { return l.name + ' x' + l.qty; }).join('; ').replace(/"/g, '""') + '"', o.total, o.method === 'bank' ? 'chuyen_khoan' : 'tien_mat'].join(',')); });
      return copyText(rows.join('\n'), 'Đã sao chép CSV. Dán vào Excel hoặc Google Sheets.');
    }
    if (el.hasAttribute('data-bk-restore')) {
      try {
        var s = JSON.parse($('bkIn').value);
        if (!s || !Array.isArray(s.menu) || !Array.isArray(s.ings) || !Array.isArray(s.orders)) throw 0;
        s.chi = s.chi || []; s.hao = s.hao || []; s.days = s.days || {}; state = s; save(); renderMenu(); renderHeader(); return toast('Đã khôi phục dữ liệu');
      } catch (x2) { return toast('Bản sao lưu không hợp lệ'); }
    }
    if (el.hasAttribute('data-reset-menu')) return armDelete(el, function () { var df = defaults(); state.menu = df.menu; state.ings = df.ings; save(); renderMenu(); toast('Đã về thực đơn mẫu, đơn hàng giữ nguyên'); });
  });

  function onField(e) {
    var t = e.target, id = t.id;
    if (id === 'paidIn') { paid = Number(t.value) || 0; return updateChange(); }
    if (id === 'cartNote') { cartNote = t.value; return; }
    if (id === 'discT') { disc.t = t.value; return updateDock(); }
    if (id === 'discV') { disc.v = Number(t.value) || 0; return updateDock(); }
    if (id === 'ldDay') { if (t.value) { viewDay = t.value; renderLedger(); } return; }
    if (id === 'ldOpen') { dayInfo(viewDay).open = t.value; save(); return updateLedgerCalc(); }
    if (id === 'ldCount') { dayInfo(viewDay).count = t.value; save(); return updateLedgerCalc(); }
    if (!ed) return;
    var d = t.dataset;
    if (d.f) { ed.o[d.f] = t.value; return; }
    if (d.g) { ed.o[d.g] = t.value; return; }
    if (d.rec) { var r = ed.o.rec[Number(d.idx)]; if (r) { if (d.rec === 'q') r.q = Number(t.value) || 0; else r.i = t.value; } return; }
    if (d.inc && t.tagName !== 'BUTTON') { var c = ed.o.inc[Number(d.idx)]; if (c) { if (d.inc === 'q') c.q = Number(t.value) || 0; else c.m = t.value; } }
  }
  document.addEventListener('input', onField);
  document.addEventListener('change', function (e) { if (e.target.tagName === 'SELECT' || e.target.type === 'date') onField(e); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });

  /* ---------- thư viện QR (tải từ CDN, nếu lỗi thì dùng mã QR tĩnh) ---------- */
  (function () {
    var urls = ['https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js', 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'], i = 0;
    function next() {
      if (window.qrcode || i >= urls.length) return;
      var s = document.createElement('script'); s.src = urls[i++];
      s.onload = function () { if (window.qrcode && qrOpen) drawQr(); else if (!window.qrcode) next(); };
      s.onerror = next; document.head.appendChild(s);
    }
    next();
  })();

  $('logo').src = IMG.logo || '';
  $('dateLabel').textContent = new Date().toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
  renderHeader(); setTab('sale');
})();
  if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
